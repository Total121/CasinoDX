# CasinoDX - sound configuration
#
# Each entry maps an internal sound key to a Bukkit Sound enum name.
# Set "enabled: false" on an entry to silence just that cue, or use the
# top-level "enabled" switch below to silence the plugin entirely.
#
# Volume is relative (1.0 = normal), pitch ranges from 0.5 to 2.0.

enabled: true

sounds:
  menu-open:
    enabled: true
    sound: BLOCK_CHEST_OPEN
    volume: 0.6
    pitch: 1.2

  click:
    enabled: true
    sound: UI_BUTTON_CLICK
    volume: 0.5
    pitch: 1.0

  bet:
    enabled: true
    sound: ENTITY_EXPERIENCE_ORB_PICKUP
    volume: 0.8
    pitch: 1.0

  win:
    enabled: true
    sound: ENTITY_PLAYER_LEVELUP
    volume: 0.8
    pitch: 1.2

  loss:
    enabled: true
    sound: ENTITY_VILLAGER_NO
    volume: 0.7
    pitch: 0.9

  cashout:
    enabled: true
    sound: BLOCK_NOTE_BLOCK_PLING
    volume: 0.8
    pitch: 1.5

  # Blackjack: played once per card as it is dealt.
  card-deal:
    enabled: true
    sound: ITEM_BOOK_PAGE_TURN
    volume: 0.7
    pitch: 1.3

  # Roulette: played when the wheel starts turning.
  roulette-spin:
    enabled: true
    sound: BLOCK_NOTE_BLOCK_HAT
    volume: 0.7
    pitch: 1.0

  # Coinflip: played when the coin leaves the hand.
  coinflip:
    enabled: true
    sound: ENTITY_ITEM_PICKUP
    volume: 0.7
    pitch: 1.4

  # Crash: played on each multiplier step.
  crash-tick:
    enabled: true
    sound: BLOCK_NOTE_BLOCK_BIT
    volume: 0.4
    pitch: 1.0

  crash-explode:
    enabled: true
    sound: ENTITY_GENERIC_EXPLODE
    volume: 0.9
    pitch: 1.0

  # Wheel: played when the wheel starts turning.
  wheel-spin:
    enabled: true
    sound: BLOCK_NOTE_BLOCK_BELL
    volume: 0.7
    pitch: 1.0

  # Slots: played once when the reels start turning. The per-reel ticks and the
  # lock-in chimes are played directly by the spin animation.
  slots-spin:
    enabled: true
    sound: BLOCK_NOTE_BLOCK_HARP
    volume: 0.7
    pitch: 0.8

  # Wheel: played when a prize is granted.
  reward:
    enabled: true
    sound: ENTITY_PLAYER_LEVELUP
    volume: 0.9
    pitch: 1.4
